[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "jsbox"
requires-python = ">=3.10"
description = "Embedded JavaScript for Python, powered by QuickJS (rquickjs) and Rust."
readme = "README.md"
license = "MIT"
maintainers = [{ name = "BMSuisse", email = "dominik.peter@bmsuisse.ch" }]
keywords = ["javascript", "quickjs", "pyo3", "sandbox"]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/bmsuisse/jsbox"

[tool.maturin]
python-source = "python"
module-name = "jsbox._jsbox"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
